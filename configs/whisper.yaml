experiment_name: exp_003_whisper
model:
  type: whisper_tiny
  whisper_model_name: tiny
  freeze_encoder: true
  unfreeze_last_n_layers: 0
  pooling: mean
  head_hidden_dims: [128, 64]
  dropout: 0.2

training:
  batch_size: 32
  learning_rate: 0.0003
  epochs: 15
  weight_decay: 0.0001
  pos_weight: 2.0

data:
  sample_rate: 16000
  context_seconds: 2.0
